{{- $opportunityRoot := "/opportunity" | relLangURL -}}
{{- $accountRoot := "/account-opportunity" | relLangURL -}}

<aside class="ai-opportunity-entry" aria-label="AI 商机入口">
  <div class="ai-opportunity-entry__header">
    <div>
      <div class="ai-opportunity-entry__eyebrow">延伸入口</div>
      <h2 class="ai-opportunity-entry__headline">继续看：AI 商机与账号商机</h2>
    </div>
    <div class="ai-opportunity-entry__signal">Related</div>
  </div>
  <div class="ai-opportunity-entry__body ai-opportunity-entry__body--compact">
    <div class="ai-opportunity-entry__button-group">
      <a class="ai-opportunity-entry__button" href="{{ $opportunityRoot }}">
        <span>AI 商机</span>
        <span aria-hidden="true">→</span>
      </a>
      <a class="ai-opportunity-entry__button ai-opportunity-entry__button--secondary" href="{{ $accountRoot }}">
        <span>账号商机</span>
        <span aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</aside>
