<!-- layouts/_default/_markup/render-link.html -->
{{- $isExternal := and (strings.HasPrefix .Destination "http") (not (strings.HasPrefix .Destination site.BaseURL)) -}}
{{- $isAivoraMain := or
  (eq .Destination "https://www.aivora.cn")
  (strings.HasPrefix .Destination "https://www.aivora.cn/")
-}}
<a href="{{ .Destination | safeURL }}" title="{{ .Text | safeHTML }}"
   {{ if $isExternal }}
     target="_blank" rel="{{ if not $isAivoraMain }}nofollow noreferrer {{ end }}noopener"{{ if $isAivoraMain }} referrerpolicy="strict-origin-when-cross-origin"{{ end }}
   {{ end }}
>
{{ .Text | safeHTML }}</a>
