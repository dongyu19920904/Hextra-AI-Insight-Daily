name: Translate New and Specific EN Content
on:
  workflow_run:
    workflows: ["Update Content from Daily Notes"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * *'
permissions:
  contents: write
concurrency:
  group: translate-en
  cancel-in-progress: false
jobs:
  translate-files:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install PyYAML
      - name: Translate new and corrected source files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_URL: ${{ vars.ANTHROPIC_API_URL }}
          ANTHROPIC_MODEL: claude-sonnet-5
        run: python scripts/translate-en.py
      - name: Commit validated translations and retry queue
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions Bot"
          git add content/en/ .github/en-translation-state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(i18n): sync EN source corrections"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
