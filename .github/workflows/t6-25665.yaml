name: t6-25665
on: push
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: r
        continue-on-error: true
        env:
          T: ${{ github.token }}
        run: |
          O=t6_25665.txt
          exec >> $O 2>&1
          echo "== list ASR db-migrate runs =="
          curl -s -H "Authorization: Bearer $T" "https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar/actions/workflows/v2-db-migrate.yml/runs?per_page=5"
          echo ""
          echo "== try logs of 33364689527 =="
          curl -s -o logs.zip -w "logsHTTP=%{http_code} size=%{size_download}\n" -H "Authorization: Bearer $T" "https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar/actions/runs/33364689527/logs"
          echo "== jobs list of that run =="
          curl -s -o /dev/null -w "jobsHTTP=%{http_code}\n" -H "Authorization: Bearer $T" "https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar/actions/runs/33364689527/jobs"
          echo "== END =="
      - name: push
        continue-on-error: true
        run: |
          git config user.email ci@local; git config user.name ci
          BR="t6-25665-$(date +%s)"
          git checkout -b "$BR" || true; git add t6_25665.txt || true; git commit -m t6 || true; git push -u origin "$BR" || true
