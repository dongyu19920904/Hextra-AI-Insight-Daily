name: probe25522
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: test cross-repo write with GITHUB_TOKEN
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== token scopes ==="
          curl -s -I -H "Authorization: Bearer $GH" https://api.github.com/user | grep -i "x-oauth-scopes\|x-accepted" || true
          echo "=== read supply repo meta ==="
          curl -s -o /dev/null -w "supply repo meta %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar
          echo "=== try PUT a probe file into supply repo workflows ==="
          B64=$(printf "name: probe-crossrepo-25522\non:\n  workflow_dispatch:\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo crossrepo\n" | base64 -w0)
          curl -s -X PUT -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar/contents/.github/workflows/xprobe25522.yaml \
            -d "{\"message\":\"xprobe25522\",\"content\":\"$B64\",\"branch\":\"main\"}" -w "\nPUT supply %{http_code}\n" | head -c 600
          echo "=== list secrets (needs admin, expect 403) ==="
          curl -s -o /dev/null -w "supply secrets %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/dongyu19920904/Aivora-Supply-Radar/actions/secrets