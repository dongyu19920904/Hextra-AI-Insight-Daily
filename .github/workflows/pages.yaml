# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  workflow_run:
    workflows: ["Update Content from Daily Notes"]
    types:
      - completed

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Runs every 2 hours

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify --ignoreCache \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Check cancelled Pages deployment
        id: pages_recovery
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'PAGES_RECOVERY'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch(
              `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages/deployments/${process.env.GITHUB_SHA}`,
              {
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                signal: AbortSignal.timeout(15000),
              }
            );
            if (!response.ok) throw new Error(`Pages status lookup failed: HTTP ${response.status}`);
            const { status } = await response.json();
            if (status === 'succeed') {
              console.log('Pages already published this commit; no retry needed.');
              return;
            }
            // deploy-pages cancels the deployment when its ten-minute poll expires.
            if (status !== 'deployment_cancelled') throw new Error(`Pages status is not retryable: ${status}`);
            console.log('Pages confirmed cancellation; retrying the existing artifact once.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'retry=true\n');
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          PAGES_RECOVERY
      - name: Retry cancelled Pages deployment once
        id: deployment_retry
        if: ${{ !cancelled() && steps.pages_recovery.outputs.retry == 'true' }}
        uses: actions/deploy-pages@v4
